name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-pc-windows-gnu

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: bun run version-packages
          publish-script: bash ./scripts/publish.sh
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          push-with-git-cli: true
          create-github-releases: true
          push-git-tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          TAG_NAME="v${VERSION}"
          echo "Uploading release assets to ${TAG_NAME}..."
          for file in dist/*; do
            if [[ -f "$file" ]]; then
              echo "Uploading $file..."
              gh release upload "$TAG_NAME" "$file" --clobber
            fi
          done

      - name: Dispatch to winget-community-pkgs
        if: steps.changesets.outputs.published == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          repository: t128n/winget-community-pkgs
          event-type: release
          client-payload: '{"package": "git-tidy"}'

