[package]
name = "git-tidy"
version = "0.2.1"
edition = "2024"
description = "Git workspace organizer and cloning utility"
license = "MIT"
authors = ["t128n"]
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs = "6"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
